version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: ci
      include: scope
