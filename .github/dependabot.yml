version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # Helidon 27+ requires Java 27 (non-LTS); stay on the 4.x line running on Java 25 LTS
      - dependency-name: "io.helidon*"
        versions: [ ">= 27" ]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [ McKratt ]
    commit-message:
      prefix: ci
      include: scope
